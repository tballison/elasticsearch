# Local cluster (1 node) + remote cluster (2 nodes) + mock HuggingFace inference service.
# Set IMAGE to the Elasticsearch Docker image to test, e.g.:
#   IMAGE=elasticsearch:main docker compose up
services:
  mock-inference:
    image: python:3.11-slim
    container_name: mock-inference
    volumes:
      - ./mock_inference.py:/app.py:ro
    command: ["python", "/app.py"]
    ports:
      - "5000:5000"
    networks:
      - esnet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  es-local:
    image: ${IMAGE:?set IMAGE=elasticsearch:TAG}
    container_name: es-local
    environment:
      - discovery.type=single-node
      - network.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=trial
      - cluster.name=local-cluster
      - node.name=es-local
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - node.store.allow_mmap=false
    ports:
      - "9200:9200"
    networks:
      - esnet
    depends_on:
      mock-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  es-remote-1:
    image: ${IMAGE:?set IMAGE}
    container_name: es-remote-1
    environment:
      - network.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=trial
      - cluster.name=remote-cluster
      - node.name=es-remote-1
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - node.store.allow_mmap=false
      - discovery.seed_hosts=es-remote-1,es-remote-2
      - cluster.initial_master_nodes=es-remote-1
    ports:
      - "9201:9200"
    networks:
      - esnet
    depends_on:
      mock-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=green || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  es-remote-2:
    image: ${IMAGE:?set IMAGE}
    container_name: es-remote-2
    environment:
      - network.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=trial
      - cluster.name=remote-cluster
      - node.name=es-remote-2
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - node.store.allow_mmap=false
      - discovery.seed_hosts=es-remote-1,es-remote-2
      - cluster.initial_master_nodes=es-remote-1
    ports:
      - "9202:9200"
    networks:
      - esnet
    depends_on:
      mock-inference:
        condition: service_healthy

networks:
  esnet:
    driver: bridge
